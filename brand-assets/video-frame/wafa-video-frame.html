<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wafa Hajj video frame</title>
<!--
  ============================================================================
  WAFA HAJJ — THE VIDEO FRAME.  One design, 1080x1920, for every video.
  ============================================================================
  ?mode=mount   deep-green mount + gold keyline window   → client proof footage
                (protects low-res sources and burned-in subtitles)
  ?mode=fill    full-bleed video + top scrim             → paid ad reels
  ?ap=9x16|16x9|1x1   aperture shape for landscape / square sources
  ?ded=<text>   dedication line (client copy) — REPLACES the tagline
  ?bg=<url>     preview: a still image where the video goes
  ?alpha=1      export: aperture becomes a true hole → transparent overlay PNG

  NAMING RULE (learned the hard way): the stage's mode class must never collide
  with a paint class. `mode=mat` + class `.mat` once made the stage itself paint
  the mount across the whole canvas and silently filled the aperture.
  ============================================================================
-->
<style>
  @font-face { font-family:'PlexAr'; src:url('file:///D:/wafahajj/brand-assets/video-frame/fonts/ibmpsa500.ttf'); }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  .stage { position:relative; width:1080px; height:1920px; overflow:hidden; }

  .still { position:absolute; object-fit:cover; z-index:1; }

  /* The mount, drawn as four bands so the aperture is a true hole in the export.
     Each band carries the same canvas-sized gradient shifted by its own offset, so
     the four read as one continuous mount. (background-attachment:fixed must NOT be
     used: Chrome then paints it across the whole canvas and destroys the hole.)
     Top of the mount is exactly brand green #1E4D2B, so the mark always sits on it. */
  .mount { position:absolute; z-index:2;
           background-image:linear-gradient(180deg,#1E4D2B 0%, #183E21 100%);
           background-size:1080px 1920px; background-repeat:no-repeat; }

  /* fill mode only: a green scrim so the brand block stays legible over any footage */
  .scrim { position:absolute; z-index:2; left:0; top:0; width:1080px; height:560px;
           background:linear-gradient(180deg, rgba(17,40,24,.95) 0%, rgba(20,52,32,.84) 42%,
                                              rgba(22,56,34,.46) 72%, rgba(22,56,34,0) 100%); }

  /* aperture edges — square corners: an aperture is cut, not rounded.
     ink recess INSIDE the gold: gold against bright Haram marble is a weak edge,
     gold against the dark mount is not, so the helper belongs on the inner side. */
  .recess  { position:absolute; z-index:3; border:2px solid #2C2C2C; }
  .keyline { position:absolute; z-index:3; border:4px solid #C89B3C; }

  /* brand block */
  .brand { position:absolute; z-index:4; left:0; right:0;
           display:flex; flex-direction:row; align-items:flex-start; justify-content:center; }
  .brand .col { display:flex; flex-direction:column; align-items:flex-start; }
  .mark { display:block; }
  .name { display:block; }        /* official artwork — the brand name is never re-typeset */
  .line { font-family:'PlexAr',sans-serif; color:#F5F1E8; line-height:1.16; }
  .url  { font-family:'PlexAr',sans-serif; color:#F5F1E8; line-height:1.1; letter-spacing:3.4px; }

  /* dedication block (client copy): the deceased's name is the largest text on the frame,
     because a proof video should be about her, not about us */
  .ded { display:none; }
  .ded-eyebrow { font-family:'PlexAr',sans-serif; font-size:19px; letter-spacing:2.6px;
                 color:#C89B3C; line-height:1.2; }
  .ded-name    { font-family:'PlexAr',sans-serif; font-size:40px; color:#F5F1E8;
                 line-height:1.14; margin-top:7px; max-width:640px; }
  .ded-when    { font-family:'PlexAr',sans-serif; font-size:22px; color:#F5F1E8;
                 line-height:1.15; margin-top:9px; }
  .mode-fill .line, .mode-fill .url, .mode-fill .name, .mode-fill .mark {
           filter:drop-shadow(0 2px 14px rgba(8,20,12,.85)); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="still" id="still" alt="">

  <div class="mount" id="mountT"></div>
  <div class="mount" id="mountB"></div>
  <div class="mount" id="mountL"></div>
  <div class="mount" id="mountR"></div>

  <div class="scrim"   id="scrim"></div>
  <div class="recess"  id="recess"></div>
  <div class="keyline" id="keyline"></div>

  <div class="brand" id="brand">
    <img class="mark" id="mark" src="file:///D:/wafahajj/brand-assets/video-frame/mark-gold-404.png" alt="">
    <div class="col">
      <img class="name" id="name" src="file:///D:/wafahajj/brand-assets/video-frame/nameblock-gold.png" alt="Wafa Hajj">
      <div class="line" id="line">A promise kept. A duty fulfilled.</div>
      <div class="ded" id="ded">
        <div class="ded-eyebrow" id="dedEyebrow">UMRAH PERFORMED FOR THE SOUL OF</div>
        <div class="ded-name"    id="dedName"></div>
        <div class="ded-when"    id="dedWhen"></div>
      </div>
      <div class="url"  id="url">WWW.WAFAHAJJ.COM</div>
    </div>
  </div>
</div>

<script>
  /* ---------------- fixed design constants ---------------- */
  var CANVAS_W = 1080, CANVAS_H = 1920;
  var TOP      = 268;          /* first brand pixel — clears the platform's top chrome    */
  var GAP      = 40;           /* brand block → aperture                                 */
  var BOTTOM   = 1880;         /* aperture bottom edge                                    */
  var MARK     = 120;          /* crescent mark                                           */
  var CLEAR    = 44;           /* clear space between mark and name (brand rule)          */
  var NAME_W   = 260;          /* official name artwork width                             */
  var NAME_R   = 296 / 503;    /* name+rule+Arabic artwork ratio (measured from the PNG)   */

  var q     = new URLSearchParams(location.search);
  var mode  = q.get('mode') || 'mount';
  var ap    = q.get('ap')   || '9x16';
  var ded   = q.get('ded');
  var bg    = q.get('bg');
  var alpha = q.get('alpha') === '1';
  var wOver = parseInt(q.get('w') || '0', 10);

  var isMount = (mode !== 'fill');
  document.getElementById('stage').className = 'stage mode-' + mode;   /* never a paint class */

  var B    = document.getElementById('brand');
  var mark = document.getElementById('mark');
  var nm   = document.getElementById('name');   /* NB: `name` alone is window.name, a string */
  var line = document.getElementById('line');
  var url  = document.getElementById('url');

  /* ---------------- brand block ---------------- */
  var nameH = Math.round(NAME_W * NAME_R);
  B.style.top       = TOP + 'px';
  B.style.gap       = CLEAR + 'px';
  mark.style.width  = MARK + 'px';
  mark.style.height = MARK + 'px';
  mark.style.marginTop = Math.round((nameH - MARK) / 2) + 'px';   /* mark optically centred on the name */
  nm.style.width    = NAME_W + 'px';
  nm.style.height   = nameH + 'px';

  /* the dedication block (client copy) takes the tagline's slot */
  line.style.fontSize  = '32px';
  line.style.marginTop = '16px';
  line.style.whiteSpace = 'nowrap';
  if (ded) {
    line.style.display = 'none';
    var dedBox = document.getElementById('ded');
    dedBox.style.display = 'block';
    dedBox.style.marginTop = '18px';
    document.getElementById('dedName').textContent = ded;
    var when = q.get('when');
    if (when) document.getElementById('dedWhen').textContent = when;
    else      document.getElementById('dedWhen').style.display = 'none';
  }
  url.style.fontSize   = '22px';
  url.style.marginTop  = '12px';

  /* ---------------- aperture, derived from the measured brand block ---------------- */
  var brandH = Math.ceil(B.getBoundingClientRect().height);
  var ratio  = ap === '16x9' ? 9 / 16 : (ap === '1x1' ? 1 : 16 / 9);   /* height / width */
  var apTop  = TOP + brandH + GAP;   /* not `top` — window.top is read-only and yields NaN */
  var W, H, X, Y;
  if (ap === '9x16') {
    H = BOTTOM - apTop; W = Math.round(H / ratio);
    if (wOver) { W = wOver; H = Math.round(W * ratio); }
    Y = BOTTOM - H;
  } else {
    W = wOver || 1000; H = Math.round(W * ratio);
    Y = apTop + Math.round((BOTTOM - apTop - H) / 2);
  }
  X = Math.round((CANVAS_W - W) / 2);

  function put(el, l, t, w, h) {
    el.style.left = l + 'px'; el.style.top = t + 'px';
    el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function band(id, l, t, w, h) {
    var el = document.getElementById(id);
    put(el, l, t, w, h);
    el.style.backgroundPosition = (-l) + 'px ' + (-t) + 'px';   /* keeps the gradient continuous */
  }
  band('mountT', 0,     0,     CANVAS_W,       Y);
  band('mountB', 0,     Y + H, CANVAS_W,       CANVAS_H - (Y + H));
  band('mountL', 0,     Y,     X,              H);
  band('mountR', X + W, Y,     CANVAS_W - (X + W), H);
  put(document.getElementById('recess'),  X - 2, Y - 2, W + 4,  H + 4);
  put(document.getElementById('keyline'), X - 6, Y - 6, W + 12, H + 12);

  function show(id, on) { document.getElementById(id).style.display = on ? 'block' : 'none'; }
  ['mountT','mountB','mountL','mountR'].forEach(function (id) { show(id, isMount); });
  show('recess',  isMount);
  show('keyline', isMount);
  show('scrim',  !isMount);

  var st = document.getElementById('still');
  show('still', false);
  if (bg && !alpha) {
    if (isMount) put(st, X, Y, W, H); else put(st, 0, 0, CANVAS_W, CANVAS_H);
    st.src = bg; show('still', true);
  }

  /* geometry is published in the title so the build script can read it back */
  document.title = 'WAFAGEOM ' + mode + ' ' + ap + ' ' + X + ' ' + Y + ' ' + W + ' ' + H +
                   ' brandH=' + brandH;
</script>
</body>
</html>
